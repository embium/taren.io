<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for better visibility -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0f" opacity="0.95"/>
  
  <!-- Main icon - stylized "T" with lightning bolt aesthetic -->
  <g filter="url(#glow)">
    <!-- Top of T -->
    <path d="M 140 140 L 372 140 L 372 200 L 292 200 L 292 372 L 220 372 L 220 200 L 140 200 Z" 
          fill="url(#iconGradient)" 
          opacity="0.95"/>
    
    <!-- Lightning accent -->
    <path d="M 280 240 L 320 280 L 290 280 L 310 320 L 270 280 L 300 280 Z" 
          fill="url(#iconGradient)" 
          opacity="0.8"/>
  </g>
  
  <!-- Subtle border glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#iconGradient)" stroke-width="4" opacity="0.3"/>
</svg>
